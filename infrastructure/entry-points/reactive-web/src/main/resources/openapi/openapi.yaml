openapi: 3.0.3
info:
  title: CrediAuth API
  description: API for user, role, and authentication management
  version: 1.0.0
  contact:
    name: CrediAuth Team
    email: support@crediauth.com

servers:
  - url: http://localhost:8082
    description: Development server
  - url: https://api.crediauth.com
    description: Production server

paths:
  # Authentication endpoints
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates a user and returns access tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequestDto'
            example:
              email: "john.doe@email.com"
              password: "12345678"
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponseDto'
              example:
                accessToken: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3MzMyMDB9..."
                email: "user@example.com"
                role: "CLIENT"
                userId: 123
                fullName: "John Doe"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'


  # User endpoints
  /api/v1/users:
    post:
      tags:
        - User Management
      summary: Create user
      description: Creates a new user in the system (requires ADMIN/ADVISOR authentication)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDto'
            example:
              names: "John Carlos"
              lastNames: "Doe Smith"
              email: "john.doe@email.com"
              baseSalary: 2500000.0
              birthDate: "1990-05-15"
              address: "Street 123 #45-67"
              phone: "+573001234567"
              documentId: "12345678"
              rolId: 15
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized - Token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Forbidden - Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/users/{documentNumber}:
    get:
      tags:
        - User Management
      summary: Check user existence
      description: Verifies if a user exists by document number
      security:
        - BearerAuth: []
      parameters:
        - name: documentNumber
          in: path
          required: true
          description: User's document number
          schema:
            type: string
          example: "12345678"
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    description: Indicates if the user exists
                    example: true
                  documentNumber:
                    type: string
                    description: Consulted document number
                    example: "12345678"
                  message:
                    type: string
                    description: Descriptive message
                    example: "User found"
        '401':
          description: Unauthorized - Token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  # Role endpoints
  /api/v1/roles:
    post:
      tags:
        - Role Management
      summary: Create role
      description: Creates a new role in the system
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolCreateRequestDto'
            example:
              name: "ADMIN"
              description: "System administrator role"
      responses:
        '200':
          description: Role successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolResponseDto'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized - Token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Role already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

    put:
      tags:
        - Role Management
      summary: Update role
      description: Updates an existing role in the system
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolUpdateRequestDto'
            example:
              idRol: 1
              name: "ADMIN"
              description: "Updated system administrator role"
      responses:
        '200':
          description: Role successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolResponseDto'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized - Token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/roles/{idRol}:
    delete:
      tags:
        - Role Management
      summary: Delete role
      description: Deletes a role from the system
      security:
        - BearerAuth: [ ]
      parameters:
        - name: idRol
          in: path
          required: true
          description: ID of the role to delete
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: Role successfully deleted
        '401':
          description: Unauthorized - Token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    # Authentication schemas
    UserLoginRequestDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email
          example: "user@example.com"
        password:
          type: string
          description: User's password
          example: "password123"
          minLength: 6

    UserLoginResponseDto:
      type: object
      required:
        - accessToken
        - email
        - role
        - userId
        - fullName
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3MzMyMDB9..."
        email:
          type: string
          format: email
          description: Authenticated user's email
          example: "user@example.com"
        role:
          type: string
          description: User's role
          example: "CLIENT"
          enum: ["ADMIN", "ADVISOR", "CLIENT"]
        userId:
          type: integer
          format: int64
          description: User's ID
          example: 123
        fullName:
          type: string
          description: User's full name
          example: "John Doe"

    # User schemas
    UserCreateRequestDto:
      type: object
      required:
        - names
        - lastNames
        - email
        - baseSalary
        - documentId
      properties:
        names:
          type: string
          description: User's first names
          example: "John Carlos"
          minLength: 1
        lastNames:
          type: string
          description: User's last names
          example: "Doe Smith"
          minLength: 1
        email:
          type: string
          format: email
          description: User's email
          example: "john.doe@email.com"
        baseSalary:
          type: number
          format: double
          description: User's base salary
          example: 2500000.0
          minimum: 0
          maximum: 15000000
        birthDate:
          type: string
          format: date
          description: User's birth date
          example: "1990-05-15"
        address:
          type: string
          description: User's address
          example: "Street 123 #45-67"
        phone:
          type: string
          description: User's phone number
          example: "+573001234567"
        documentId:
          type: string
          description: User's identity document number
          example: "12345678"
          minLength: 1
        rolId:
          type: integer
          format: int64
          description: Assigned role ID
          example: 15

    UserResponseDto:
      type: object
      required:
        - id
        - names
        - lastNames
        - email
        - baseSalary
        - documentId
      properties:
        id:
          type: string
          description: User's unique ID
          example: "1"
        names:
          type: string
          description: User's first names
          example: "John Carlos"
        lastNames:
          type: string
          description: User's last names
          example: "Doe Smith"
        email:
          type: string
          format: email
          description: User's email
          example: "john.doe@email.com"
        baseSalary:
          type: number
          format: double
          description: User's base salary
          example: 2500000.0
        birthDate:
          type: string
          format: date
          description: User's birth date
          example: "1990-05-15"
        address:
          type: string
          description: User's address
          example: "Street 123 #45-67"
        phone:
          type: string
          description: User's phone number
          example: "+573001234567"
        documentId:
          type: string
          description: User's identity document number
          example: "12345678"
        rolId:
          type: string
          description: Assigned role ID
          example: "1"

    # Role schemas
    RolCreateRequestDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Role name
          example: "ADMIN"
          minLength: 2
          maxLength: 50
        description:
          type: string
          description: Role description
          example: "System administrator role"
          maxLength: 200

    RolUpdateRequestDto:
      type: object
      required:
        - idRol
        - name
      properties:
        idRol:
          type: integer
          format: int64
          description: ID of the role to update
          example: 1
        name:
          type: string
          description: New role name
          example: "ADMIN"
          minLength: 2
          maxLength: 50
        description:
          type: string
          description: New role description
          example: "Updated system administrator role"
          maxLength: 200

    RolResponseDto:
      type: object
      required:
        - idRol
        - name
      properties:
        idRol:
          type: integer
          format: int64
          description: Role's unique ID
          example: 1
        name:
          type: string
          description: Role name
          example: "ADMIN"
        description:
          type: string
          description: Role description
          example: "System administrator role"

    # Error response schema
    ErrorResponseDto:
      type: object
      required:
        - message
        - code
        - timestamp
      properties:
        message:
          type: string
          description: Descriptive error message
          example: "Invalid credentials"
        code:
          type: string
          description: Specific error code
          example: "AUTH_001"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp in ISO 8601 format
          example: "2024-01-15T10:30:00Z"