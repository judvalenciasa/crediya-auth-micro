openapi: 3.0.3
info:
  title: CrediAuth API
  description: API para gestión de usuarios, roles y autenticación
  version: 1.0.0
  contact:
    name: CrediAuth Team
    email: support@crediauth.com

servers:
  - url: http://localhost:8082
    description: Servidor de desarrollo
  - url: https://api.crediauth.com
    description: Servidor de producción

paths:
  # Authentication endpoints
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión
      description: Autentica un usuario y retorna tokens de acceso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequestDto'
            example:
              email: "usuario@example.com"
              password: "password123"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponseDto'
              example:
                accessToken: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3MzMyMDB9..."
                refreshToken: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3ODU2MDB9..."
                email: "usuario@example.com"
                role: "CLIENTE"
                userId: 123
                fullName: "Juan Pérez"
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Renovar token
      description: Renueva el token de acceso usando el refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
            example: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3ODU2MDB9..."
      responses:
        '200':
          description: Token renovado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponseDto'
        '401':
          description: Refresh token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  # User endpoints
  /api/v1/users:
    post:
      tags:
        - User Management
      summary: Crear usuario
      description: Crea un nuevo usuario en el sistema (requiere autenticación ADMIN/ASESOR)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDto'
            example:
              names: "Juan Carlos"
              lastNames: "Pérez García"
              email: "juan.perez@email.com"
              baseSalary: 2500000.0
              birthDate: "1990-05-15"
              address: "Calle 123 #45-67"
              phone: "+573001234567"
              documentId: "12345678"
              rolId: 15
      responses:
        '200':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: No autorizado - Token requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Prohibido - Rol insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Email ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/users/{documentNumber}:
    get:
      tags:
        - User Management
      summary: Verificar existencia de usuario
      description: Verifica si existe un usuario por número de documento
      security:
        - BearerAuth: []
      parameters:
        - name: documentNumber
          in: path
          required: true
          description: Número de documento del usuario
          schema:
            type: string
          example: "12345678"
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    description: Indica si el usuario existe
                    example: true
                  documentNumber:
                    type: string
                    description: Número de documento consultado
                    example: "12345678"
                  message:
                    type: string
                    description: Mensaje descriptivo
                    example: "Usuario encontrado"
        '401':
          description: No autorizado - Token requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  # Role endpoints
  /api/v1/roles:
    post:
      tags:
        - Role Management
      summary: Crear rol
      description: Crea un nuevo rol en el sistema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolCreateRequestDto'
            example:
              name: "ADMIN"
              description: "Rol de administrador del sistema"
      responses:
        '200':
          description: Rol creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolResponseDto'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: No autorizado - Token requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Rol ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

    put:
      tags:
        - Role Management
      summary: Actualizar rol
      description: Actualiza un rol existente en el sistema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolUpdateRequestDto'
            example:
              idRol: 1
              name: "ADMIN"
              description: "Rol de administrador del sistema actualizado"
      responses:
        '200':
          description: Rol actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolResponseDto'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: No autorizado - Token requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/roles/{idRol}:
    delete:
      tags:
        - Role Management
      summary: Eliminar rol
      description: Elimina un rol del sistema
      security:
        - BearerAuth: []
      parameters:
        - name: idRol
          in: path
          required: true
          description: ID del rol a eliminar
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: Rol eliminado exitosamente
        '401':
          description: No autorizado - Token requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido del endpoint de login

  schemas:
    # Authentication schemas
    UserLoginRequestDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          example: "usuario@example.com"
        password:
          type: string
          description: Contraseña del usuario
          example: "password123"
          minLength: 6

    UserLoginResponseDto:
      type: object
      required:
        - accessToken
        - refreshToken
        - email
        - role
        - userId
        - fullName
      properties:
        accessToken:
          type: string
          description: Token de acceso JWT
          example: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3MzMyMDB9..."
        refreshToken:
          type: string
          description: Token de renovación JWT
          example: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c3VhcmlvQGV4YW1wbGUuY29tIiwiaWF0IjoxNjM5NzI5NjAwLCJleHAiOjE2Mzk3ODU2MDB9..."
        email:
          type: string
          format: email
          description: Email del usuario autenticado
          example: "usuario@example.com"
        role:
          type: string
          description: Rol del usuario
          example: "CLIENTE"
          enum: ["ADMIN", "ASESOR", "CLIENTE"]
        userId:
          type: integer
          format: int64
          description: ID del usuario
          example: 123
        fullName:
          type: string
          description: Nombre completo del usuario
          example: "Juan Pérez"

    # User schemas
    UserCreateRequestDto:
      type: object
      required:
        - names
        - lastNames
        - email
        - baseSalary
        - documentId
      properties:
        names:
          type: string
          description: Nombres del usuario
          example: "Juan Carlos"
          minLength: 1
        lastNames:
          type: string
          description: Apellidos del usuario
          example: "Pérez García"
          minLength: 1
        email:
          type: string
          format: email
          description: Email del usuario
          example: "juan.perez@email.com"
        baseSalary:
          type: number
          format: double
          description: Salario base del usuario
          example: 2500000.0
          minimum: 0
          maximum: 15000000
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento
          example: "1990-05-15"
        address:
          type: string
          description: Dirección del usuario
          example: "Calle 123 #45-67"
        phone:
          type: string
          description: Teléfono del usuario
          example: "+573001234567"
        documentId:
          type: string
          description: Número de documento de identidad
          example: "12345678"
          minLength: 1
        rolId:
          type: integer
          format: int64
          description: ID del rol asignado
          example: 15

    UserResponseDto:
      type: object
      required:
        - id
        - names
        - lastNames
        - email
        - baseSalary
        - documentId
      properties:
        id:
          type: string
          description: ID único del usuario
          example: "1"
        names:
          type: string
          description: Nombres del usuario
          example: "Juan Carlos"
        lastNames:
          type: string
          description: Apellidos del usuario
          example: "Pérez García"
        email:
          type: string
          format: email
          description: Email del usuario
          example: "juan.perez@email.com"
        baseSalary:
          type: number
          format: double
          description: Salario base del usuario
          example: 2500000.0
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento
          example: "1990-05-15"
        address:
          type: string
          description: Dirección del usuario
          example: "Calle 123 #45-67"
        phone:
          type: string
          description: Teléfono del usuario
          example: "+573001234567"
        documentId:
          type: string
          description: Número de documento de identidad
          example: "12345678"
        rolId:
          type: string
          description: ID del rol asignado
          example: "1"

    # Role schemas
    RolCreateRequestDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Nombre del rol
          example: "ADMIN"
          minLength: 2
          maxLength: 50
        description:
          type: string
          description: Descripción del rol
          example: "Rol de administrador del sistema"
          maxLength: 200

