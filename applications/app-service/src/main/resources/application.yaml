server:
  port: 8082
spring:
  application:
    name: "crediauth"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya_autenticacion"
    schema: "public"
    username: "crediya"
    password: "crediya"
springdoc:
  swagger-ui:
    url: "/openapi/openapi.yaml"
    path: "/swagger-ui.html"
    config-url: "/api-docs/swagger-config"
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
  api-docs:
    path: /api-docs
  packages-to-scan: co.com.crediauth.api
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

api:
  base-path: "/api"
  version: "/v1"

# Configuración de JWT
jwt:
  secret: tu-clave-secreta-super-mega-ultra-larga-y-segura-para-produccion-que-debe-tener-al-menos-64-caracteres-para-cumplir-con-hs512
  expiration: 2

# Configuración de seguridad
security:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /openapi/openapi.yaml
    - /api-docs/**
    - /swagger-ui/**
    - /webjars/**
    - /v3/api-docs/**
    - /actuator/health