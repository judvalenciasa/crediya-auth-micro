server:
  port: 8082
spring:
  application:
    name: "crediauth"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya_autenticacion"
    schema: "public"
    username: "crediya"
    password: "crediya"
springdoc:
  swagger-ui:
    url: "/openapi/openapi.yaml"  # Esto apunta al controlador
  api-docs:
    path: /api-docs
  packages-to-scan: co.com.crediauth.api

api:
  base-path: "/api"
  version: "/v1"

# Configuración de JWT
jwt:
  secret: tu-clave-secreta-super-mega-ultra-larga-y-segura-para-produccion-que-debe-tener-al-menos-64-caracteres-para-cumplir-con-hs512
  expiration: 86400000 # 24 horas en milisegundos
  refresh-expiration: 604800000 # 7 días en milisegundos

# Configuración de seguridad
security:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /openapi/openapi.yaml
    - /actuator/health